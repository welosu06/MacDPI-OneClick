name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: macdpi-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and test clean patched sources
        shell: bash
        run: /bin/bash tests/test-release.sh

      - name: Build and verify macOS ZIP
        shell: bash
        run: /bin/bash scripts/build-release.sh

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          ZIP="dist/MacDPI-OneClick-${TAG}.zip"
          SHA="${ZIP}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "$SHA" \
            --target "$GITHUB_SHA" \
            --title "MacDPI OneClick ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --latest
