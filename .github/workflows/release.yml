name: Build macOS Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n MacDPI.command
          bash -n Install.command
          bash -n DPI_Ac.command
          bash -n DPI_Kapat.command
          bash -n Durum.command
          bash -n Kaldir.command
          bash -n NetworkSafety.sh

      - name: Build Mac-friendly ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.3.0"
          PACKAGE="MacDPI-OneClick-${VERSION}"

          rm -rf "${PACKAGE}" "${PACKAGE}.zip" verify
          mkdir -p "${PACKAGE}"

          cp MacDPI.command Install.command DPI_Ac.command DPI_Kapat.command Durum.command Kaldir.command NetworkSafety.sh README.md README_TR.md SECURITY.md LICENSE "${PACKAGE}/"
          chmod 755 "${PACKAGE}"/*.command

          /usr/bin/ditto -c -k --keepParent "${PACKAGE}" "${PACKAGE}.zip"

          mkdir verify
          /usr/bin/ditto -x -k "${PACKAGE}.zip" verify

          test -x "verify/${PACKAGE}/MacDPI.command"
          test -x "verify/${PACKAGE}/Install.command"
          test -x "verify/${PACKAGE}/DPI_Ac.command"
          test -x "verify/${PACKAGE}/DPI_Kapat.command"
          test -x "verify/${PACKAGE}/Durum.command"
          test -x "verify/${PACKAGE}/Kaldir.command"
          test -f "verify/${PACKAGE}/NetworkSafety.sh"
          test -f "verify/${PACKAGE}/SECURITY.md"

          shasum -a 256 "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"

      - name: Publish v1.3.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v1.3.0"
          ZIP="MacDPI-OneClick-${VERSION}.zip"
          SHA="${ZIP}.sha256"
          NOTES="MacDPI OneClick v1.3.0 adds fail-safe network protection. It backs up the existing DHCP/manual IP and DNS configuration, checks for .240 address conflicts, pins MacDPI to reviewed commit 30556c5dd90d23819e32b4c2bfb8b8b670cde8a4, tests connectivity after enabling, and automatically restores the saved network configuration if activation fails. Disable and uninstall actions also restore the saved network settings. Includes bilingual beginner instructions and the Desktop Control Center."

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ZIP}" "${SHA}" --clobber
          else
            gh release create "${VERSION}" "${ZIP}" "${SHA}" --target "${GITHUB_SHA}" --title "MacDPI OneClick v1.3.0" --notes "${NOTES}"
          fi
