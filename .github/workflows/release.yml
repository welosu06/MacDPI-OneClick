name: Build macOS Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mac-friendly ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.1.0"
          PACKAGE="MacDPI-OneClick-${VERSION}"

          rm -rf "${PACKAGE}" "${PACKAGE}.zip" verify
          mkdir -p "${PACKAGE}"

          cp MacDPI.command Install.command DPI_Ac.command DPI_Kapat.command Durum.command Kaldir.command README.md LICENSE "${PACKAGE}/"
          chmod 755 "${PACKAGE}"/*.command

          /usr/bin/ditto -c -k --keepParent "${PACKAGE}" "${PACKAGE}.zip"

          mkdir verify
          /usr/bin/ditto -x -k "${PACKAGE}.zip" verify

          test -x "verify/${PACKAGE}/MacDPI.command"
          test -x "verify/${PACKAGE}/Install.command"
          test -x "verify/${PACKAGE}/DPI_Ac.command"
          test -x "verify/${PACKAGE}/DPI_Kapat.command"
          test -x "verify/${PACKAGE}/Durum.command"
          test -x "verify/${PACKAGE}/Kaldir.command"

          shasum -a 256 "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"

      - name: Publish v1.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v1.1.0"
          ZIP="MacDPI-OneClick-${VERSION}.zip"
          SHA="${ZIP}.sha256"
          NOTES="MacDPI OneClick v1.1.0 introduces a single-terminal Control Center. Download MacDPI-OneClick-v1.1.0.zip, extract it, then open MacDPI.command. Choose Install, Enable, Disable, Status, Update/Repair, or Uninstall from one menu. The ZIP is built on macOS and verified to preserve executable permissions. Supports Apple Silicon M1-M5 and Intel Macs. macOS may require Right-click > Open on first launch because the project is not Apple-notarized."

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${ZIP}" "${SHA}" --clobber
          else
            gh release create "${VERSION}" "${ZIP}" "${SHA}" --target "${GITHUB_SHA}" --title "MacDPI OneClick v1.1.0" --notes "${NOTES}"
          fi
